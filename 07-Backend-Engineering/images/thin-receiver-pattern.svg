<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="475" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b" text-anchor="middle">High-Performance "Thin Receiver" Ingress Pattern</text>

  <!-- External Provider -->
  <rect x="30" y="160" width="130" height="100" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="95" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7e22ce" text-anchor="middle">Stripe / GitHub</text>
  <text x="95" y="225" font-family="Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle">(Webhook Sender)</text>

  <!-- Inbound Arrow -->
  <line x1="160" y1="190" x2="240" y2="190" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">POST /hooks</text>

  <!-- Response Arrow -->
  <line x1="240" y1="230" x2="160" y2="230" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="200" y="245" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">202 Accepted (&lt;20ms)</text>

  <!-- Thin Ingress Controller Box -->
  <rect x="240" y="100" width="250" height="220" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="365" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0369a1" text-anchor="middle">⚡ Thin Ingress Controller</text>
  
  <rect x="260" y="150" width="210" height="35" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="365" y="172" font-family="Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">1. Verify HMAC Signature</text>

  <rect x="260" y="195" width="210" height="35" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="365" y="217" font-family="Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">2. Check Idempotency Key</text>

  <rect x="260" y="240" width="210" height="35" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="365" y="262" font-family="Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">3. Push Event to Queue</text>

  <rect x="260" y="280" width="210" height="25" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="365" y="297" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">4. Return 202 Accepted</text>

  <!-- Queue Arrow -->
  <line x1="490" y1="210" x2="550" y2="210" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <!-- Message Queue -->
  <rect x="550" y="145" width="130" height="130" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="615" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">RabbitMQ /</text>
  <text x="615" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">Kafka / Redis</text>

  <!-- Worker Arrow -->
  <line x1="680" y1="210" x2="740" y2="210" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-gray)"/>

  <!-- Background Workers -->
  <rect x="740" y="110" width="180" height="200" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="830" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">👷 Background Worker</text>
  
  <rect x="755" y="155" width="150" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="830" y="175" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Execute DB Updates</text>

  <rect x="755" y="195" width="150" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="830" y="215" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Send Customer Emails</text>

  <rect x="755" y="235" width="150" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="830" y="255" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Provision Cloud Resources</text>

  <text x="475" y="375" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">Ingress response is lightning fast (&lt;20ms) — Heavy operations never block webhooks</text>

  <!-- Markers -->
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
