<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="475" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b" text-anchor="middle">Transactional Outbox Pattern for Webhook Senders</text>

  <!-- User Request Phase -->
  <rect x="40" y="80" width="380" height="360" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="230" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">1. User Action Handler (Fast HTTP Response)</text>

  <rect x="70" y="140" width="320" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="230" y="165" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">User clicks: "Complete Task"</text>

  <!-- ACID Transaction Box -->
  <rect x="70" y="200" width="320" height="150" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" stroke-dasharray="4"/>
  <text x="230" y="225" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#a16207" text-anchor="middle">SINGLE ACID DATABASE TRANSACTION</text>
  
  <rect x="90" y="240" width="280" height="40" rx="5" fill="#ffffff" stroke="#eab308" stroke-width="1.5"/>
  <text x="230" y="265" font-family="Consolas, monospace" font-size="12" fill="#0f172a" text-anchor="middle">UPDATE tasks SET status='DONE'</text>

  <rect x="90" y="290" width="280" height="40" rx="5" fill="#ffffff" stroke="#eab308" stroke-width="1.5"/>
  <text x="230" y="315" font-family="Consolas, monospace" font-size="12" fill="#0f172a" text-anchor="middle">INSERT INTO webhook_outbox (...)</text>

  <rect x="70" y="370" width="320" height="45" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="230" y="398" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">Commit &amp; Return 200 OK to Browser (0ms Lag)</text>

  <!-- Dispatcher Worker Phase -->
  <rect x="470" y="80" width="440" height="360" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="690" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">2. Asynchronous Dispatcher Worker</text>

  <rect x="500" y="140" width="380" height="45" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="690" y="168" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#7e22ce" text-anchor="middle">Poll PENDING rows from webhook_outbox</text>

  <rect x="500" y="205" width="380" height="45" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="690" y="233" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">SSRF Check: Block Private IPs &amp; Redirects</text>

  <rect x="500" y="270" width="380" height="45" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="690" y="298" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#3730a3" text-anchor="middle">Sign HMAC &amp; HTTP POST to Customer Endpoint</text>

  <rect x="500" y="335" width="380" height="80" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="690" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Delivery Result Handling:</text>
  <text x="690" y="380" font-family="Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">2xx -&gt; Mark DELIVERED</text>
  <text x="690" y="400" font-family="Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">Error/Timeout -&gt; Exponential Backoff + Jitter Retry</text>
</svg>
