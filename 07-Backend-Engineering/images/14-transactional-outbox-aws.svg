<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 430" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="475" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Transactional Outbox Pattern Architecture</text>

  <!-- Left Container: ACID Transaction -->
  <rect x="40" y="70" width="410" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="245" y="100" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">1. User Request (Synchronous API Call)</text>

  <rect x="70" y="125" width="350" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="245" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">User Action: POST /tasks/123/complete</text>

  <rect x="70" y="180" width="350" height="135" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" stroke-dasharray="4"/>
  <text x="245" y="205" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#a16207" text-anchor="middle">SINGLE ACID DATABASE TRANSACTION</text>

  <rect x="90" y="220" width="310" height="35" rx="4" fill="#ffffff" stroke="#eab308" stroke-width="1.5"/>
  <text x="245" y="242" font-family="Consolas, monospace" font-size="11" fill="#0f172a" text-anchor="middle">UPDATE tasks SET status='DONE'</text>

  <rect x="90" y="265" width="310" height="35" rx="4" fill="#ffffff" stroke="#eab308" stroke-width="1.5"/>
  <text x="245" y="287" font-family="Consolas, monospace" font-size="11" fill="#0f172a" text-anchor="middle">INSERT INTO webhook_outbox (...)</text>

  <rect x="70" y="335" width="350" height="45" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="245" y="362" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Commit &amp; Return 200 OK to User (0ms Latency)</text>

  <!-- Right Container: Dispatcher Worker -->
  <rect x="490" y="70" width="420" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="700" y="100" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">2. Asynchronous Dispatcher Worker</text>

  <rect x="515" y="125" width="370" height="40" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="700" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7e22ce" text-anchor="middle">Poll PENDING rows from webhook_outbox table</text>

  <rect x="515" y="180" width="370" height="40" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="700" y="205" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">SSRF Guard: Check Target IP is not Private/Internal</text>

  <rect x="515" y="235" width="370" height="40" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="700" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3730a3" text-anchor="middle">Compute HMAC Signature &amp; HTTP POST to Customer</text>

  <rect x="515" y="290" width="370" height="90" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="700" y="315" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Outcome Handling:</text>
  <text x="700" y="338" font-family="Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">2xx OK → Mark DELIVERED</text>
  <text x="700" y="358" font-family="Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">Error/Timeout → Exponential Backoff + Jitter</text>
</svg>
