<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="475" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Duplicate Delivery &amp; Database Idempotency Flow</text>

  <!-- Inbound Event -->
  <rect x="40" y="80" width="180" height="90" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="130" y="115" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#7e22ce" text-anchor="middle">Webhook Delivery</text>
  <text x="130" y="135" font-family="Consolas, monospace" font-size="11" fill="#6b21a8" text-anchor="middle">ID: evt_pay_101</text>
  <text x="130" y="155" font-family="Arial, sans-serif" font-size="10" fill="#9333ea" text-anchor="middle">(Attempt #1 or #2)</text>

  <line x1="220" y1="125" x2="290" y2="125" stroke="#0284c7" stroke-width="3" marker-end="url(#arr-blue)"/>

  <!-- Decision Diamond / Box -->
  <rect x="290" y="80" width="240" height="90" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="410" y="115" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">Check Idempotency Table</text>
  <text x="410" y="138" font-family="Consolas, monospace" font-size="11" fill="#0f172a" text-anchor="middle">SELECT 1 FROM events</text>
  <text x="410" y="155" font-family="Consolas, monospace" font-size="11" fill="#0f172a" text-anchor="middle">WHERE id = 'evt_pay_101'</text>

  <!-- Branches -->
  <!-- 1. Already Exists -->
  <line x1="410" y1="170" x2="410" y2="250" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <text x="450" y="215" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ea580c">EXISTS</text>

  <rect x="290" y="250" width="240" height="85" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="410" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="middle">DUPLICATE DETECTED!</text>
  <text x="410" y="302" font-family="Arial, sans-serif" font-size="11" fill="#9a3412" text-anchor="middle">1. Skip business execution</text>
  <text x="410" y="322" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">2. Return HTTP 200 OK</text>

  <!-- 2. Does Not Exist -->
  <line x1="530" y1="125" x2="610" y2="125" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="570" y="115" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#16a34a">NEW</text>

  <!-- Transaction Box -->
  <rect x="610" y="65" width="300" height="270" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="4"/>
  <text x="760" y="95" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">SINGLE ACID TRANSACTION</text>

  <rect x="630" y="115" width="260" height="45" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="760" y="135" font-family="Consolas, monospace" font-size="11" fill="#0f172a" text-anchor="middle">1. INSERT INTO processed_events</text>
  <text x="760" y="150" font-family="Consolas, monospace" font-size="10" fill="#16a34a" text-anchor="middle">VALUES ('evt_pay_101')</text>

  <rect x="630" y="170" width="260" height="45" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="760" y="190" font-family="Consolas, monospace" font-size="11" fill="#0f172a" text-anchor="middle">2. UPDATE user_account</text>
  <text x="760" y="205" font-family="Consolas, monospace" font-size="10" fill="#0284c7" text-anchor="middle">SET plan = 'PRO'</text>

  <rect x="630" y="230" width="260" height="45" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="760" y="258" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">3. COMMIT &amp; Return 200 OK</text>

  <text x="475" y="390" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Ensures exactly-once side-effect execution even under network retry storms</text>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
