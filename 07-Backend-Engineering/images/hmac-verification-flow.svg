<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="475" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b" text-anchor="middle">HMAC SHA-256 Webhook Security &amp; Verification Flow</text>

  <!-- Left Side: Provider Sign -->
  <rect x="40" y="75" width="410" height="375" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="245" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569" text-anchor="middle">1. SENDER (Stripe / GitHub)</text>

  <rect x="70" y="130" width="350" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="245" y="160" font-family="Consolas, monospace" font-size="13" fill="#0f172a" text-anchor="middle">Raw Body Bytes + Timestamp (t)</text>

  <rect x="170" y="210" width="150" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="245" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">Shared Secret Key</text>

  <rect x="120" y="280" width="250" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="245" y="308" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Compute HMAC-SHA256</text>

  <rect x="70" y="355" width="350" height="65" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="245" y="380" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Attach to HTTP Header:</text>
  <text x="245" y="405" font-family="Consolas, monospace" font-size="11" fill="#2563eb" text-anchor="middle">Stripe-Signature: t=1700...,v1=8f3b2...</text>

  <!-- Right Side: Receiver Verification -->
  <rect x="500" y="75" width="410" height="375" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="705" y="105" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#475569" text-anchor="middle">2. RECEIVER (Your Backend Application)</text>

  <rect x="530" y="130" width="350" height="50" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="705" y="160" font-family="Consolas, monospace" font-size="13" fill="#0f172a" text-anchor="middle">Read EXACT Raw Request Bytes</text>

  <rect x="630" y="210" width="150" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="705" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">Shared Secret Key</text>

  <rect x="580" y="280" width="250" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="705" y="308" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Re-Compute HMAC-SHA256</text>

  <rect x="530" y="355" width="350" height="65" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="705" y="380" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">MessageDigest.isEqual(computed, header)</text>
  <text x="705" y="405" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">MATCH? -&gt; Safe to Process JSON!</text>
</svg>
