<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="475" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b" text-anchor="middle">API Polling (Pull) vs Webhooks (Push)</text>
  
  <!-- Left Box: Polling -->
  <rect x="40" y="70" width="410" height="380" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="245" y="105" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#dc2626" text-anchor="middle">Traditional Polling (Inefficient)</text>
  
  <!-- Polling Actors -->
  <rect x="70" y="130" width="110" height="45" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="125" y="158" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">Our Backend</text>
  
  <rect x="310" y="130" width="110" height="45" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="365" y="158" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7e22ce" text-anchor="middle">Stripe API</text>
  
  <!-- Polling Arrows -->
  <line x1="180" y1="200" x2="310" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="245" y="193" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">1. Is payment done?</text>
  <line x1="310" y1="225" x2="180" y2="225" stroke="#ef4444" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-red)"/>
  <text x="245" y="240" font-family="Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">"No, Pending" (Wasted)</text>

  <line x1="180" y1="270" x2="310" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="245" y="263" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">2. Is payment done?</text>
  <line x1="310" y1="295" x2="180" y2="295" stroke="#ef4444" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-red)"/>
  <text x="245" y="310" font-family="Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">"No, Pending" (Wasted)</text>

  <line x1="180" y1="340" x2="310" y2="340" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="245" y="333" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">3. Is payment done?</text>
  <line x1="310" y1="365" x2="180" y2="365" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="245" y="380" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">"Yes, Succeeded!" (Delayed)</text>
  
  <text x="245" y="425" font-family="Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">High latency + Massive wasted server requests</text>

  <!-- Right Box: Webhook -->
  <rect x="500" y="70" width="410" height="380" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="705" y="105" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#16a34a" text-anchor="middle">Webhook Push (Instant &amp; Efficient)</text>
  
  <!-- Webhook Actors -->
  <rect x="530" y="130" width="110" height="45" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="585" y="158" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7e22ce" text-anchor="middle">Stripe API</text>

  <rect x="770" y="130" width="110" height="45" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="825" y="158" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">Our Backend</text>

  <!-- Event bubble -->
  <rect x="530" y="220" width="130" height="45" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="595" y="240" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">Event Occurs:</text>
  <text x="595" y="255" font-family="Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle">payment.succeeded</text>

  <!-- Webhook Arrows -->
  <line x1="660" y1="242" x2="770" y2="242" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green-lg)"/>
  <text x="715" y="232" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">HTTP POST (Immediate)</text>

  <line x1="770" y1="310" x2="640" y2="310" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="705" y="302" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="middle">HTTP 200 OK (Acknowledged)</text>

  <text x="705" y="425" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">0ms average delay • Zero wasted requests</text>

  <!-- Markers -->
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-green-lg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>
</svg>
