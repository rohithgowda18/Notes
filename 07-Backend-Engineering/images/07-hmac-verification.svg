<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="475" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">HMAC-SHA256 Webhook Signature &amp; Raw Body Verification</text>

  <!-- Left Box: Sender -->
  <rect x="40" y="70" width="410" height="350" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="245" y="100" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#7e22ce" text-anchor="middle">1. SENDER (Stripe / GitHub)</text>

  <rect x="65" y="120" width="360" height="45" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="245" y="148" font-family="Consolas, monospace" font-size="12" fill="#0f172a" text-anchor="middle">Exact Raw JSON Wire Bytes</text>

  <rect x="155" y="185" width="180" height="35" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="245" y="208" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">Shared Secret Key</text>

  <rect x="110" y="240" width="270" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="245" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">HMAC-SHA256(Raw Bytes, Secret)</text>

  <rect x="65" y="305" width="360" height="60" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="245" y="328" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Attach to Request Header:</text>
  <text x="245" y="350" font-family="Consolas, monospace" font-size="11" fill="#7e22ce" text-anchor="middle">Stripe-Signature: t=1700..., v1=0x8f3b...</text>

  <!-- Right Box: Receiver -->
  <rect x="500" y="70" width="410" height="350" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="705" y="100" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0369a1" text-anchor="middle">2. RECEIVER (Our Backend)</text>

  <rect x="525" y="120" width="360" height="45" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="705" y="148" font-family="Consolas, monospace" font-size="12" fill="#0f172a" text-anchor="middle">Capture Raw Bytes (BEFORE JSON Parsing)</text>

  <rect x="615" y="185" width="180" height="35" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="705" y="208" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">Shared Secret Key</text>

  <rect x="570" y="240" width="270" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="705" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Re-Calculate HMAC-SHA256</text>

  <rect x="525" y="305" width="360" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="705" y="328" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">MessageDigest.isEqual(computed, header)</text>
  <text x="705" y="350" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">VALID? → Parse JSON &amp; Return 200 OK</text>

  <text x="475" y="440" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">CRITICAL: Re-serializing parsed JSON will change spacing/ordering and break the signature verification!</text>
</svg>
