<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="475" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Thin Receiver Ingress Architecture (Asynchronous Queueing)</text>

  <!-- Inbound POST -->
  <rect x="40" y="140" width="140" height="90" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="110" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7e22ce" text-anchor="middle">Provider</text>
  <text x="110" y="195" font-family="Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle">(Stripe / GitHub)</text>

  <line x1="180" y1="170" x2="250" y2="170" stroke="#0284c7" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="215" y="160" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">POST</text>

  <line x1="250" y1="200" x2="180" y2="200" stroke="#16a34a" stroke-width="3" marker-end="url(#arr-green)"/>
  <text x="215" y="218" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="middle">202 OK (&lt;20ms)</text>

  <!-- Thin Receiver Controller -->
  <rect x="250" y="90" width="240" height="210" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="370" y="120" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0369a1" text-anchor="middle">⚡ Thin Ingress Controller</text>

  <rect x="270" y="140" width="200" height="35" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="370" y="162" font-family="Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">1. Validate HMAC Signature</text>

  <rect x="270" y="185" width="200" height="35" rx="5" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
  <text x="370" y="207" font-family="Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">2. Push Payload to Queue</text>

  <rect x="270" y="230" width="200" height="35" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="370" y="252" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">3. Return HTTP 202 Fast</text>

  <!-- Queue Line -->
  <line x1="490" y1="195" x2="550" y2="195" stroke="#ea580c" stroke-width="3" marker-end="url(#arr-orange)"/>

  <!-- Queue Broker -->
  <rect x="550" y="125" width="140" height="140" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="620" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="middle">Message Queue</text>
  <text x="620" y="200" font-family="Arial, sans-serif" font-size="11" fill="#9a3412" text-anchor="middle">(RabbitMQ /</text>
  <text x="620" y="218" font-family="Arial, sans-serif" font-size="11" fill="#9a3412" text-anchor="middle">Kafka / SQS)</text>

  <!-- Worker Line -->
  <line x1="690" y1="195" x2="750" y2="195" stroke="#64748b" stroke-width="3" marker-end="url(#arr-gray)"/>

  <!-- Background Workers -->
  <rect x="750" y="100" width="160" height="190" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="830" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">👷 Async Workers</text>

  <rect x="765" y="150" width="130" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="830" y="170" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Update User Plan</text>

  <rect x="765" y="190" width="130" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="830" y="210" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Send Invoices</text>

  <rect x="765" y="230" width="130" height="30" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="830" y="250" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Provision Infra</text>

  <text x="475" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">Ingress latency stays under 20ms — Protects servers from timeouts during burst traffic</text>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
