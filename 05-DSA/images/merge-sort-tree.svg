<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="475" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Merge Sort: Divide, Conquer &amp; Merge Tree</text>

  <!-- Top Array -->
  <rect x="395" y="60" width="160" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="475" y="85" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0369a1" text-anchor="middle">[ 5,  3,  8,  1 ]</text>

  <!-- Level 1 Divide Arrows -->
  <line x1="430" y1="100" x2="270" y2="140" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="520" y1="100" x2="680" y2="140" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Level 1 Nodes -->
  <rect x="215" y="140" width="110" height="35" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="270" y="163" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">[ 5,  3 ]</text>

  <rect x="625" y="140" width="110" height="35" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="680" y="163" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">[ 8,  1 ]</text>

  <!-- Level 2 Divide Arrows -->
  <line x1="250" y1="175" x2="160" y2="215" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="290" y1="175" x2="380" y2="215" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="660" y1="175" x2="570" y2="215" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="700" y1="175" x2="790" y2="215" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Single Elements -->
  <rect x="135" y="215" width="50" height="35" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="160" y="238" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">[5]</text>

  <rect x="355" y="215" width="50" height="35" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="238" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">[3]</text>

  <rect x="545" y="215" width="50" height="35" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="570" y="238" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">[8]</text>

  <rect x="765" y="215" width="50" height="35" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="790" y="238" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#92400e" text-anchor="middle">[1]</text>

  <!-- Merge Level 1 Arrows -->
  <line x1="160" y1="250" x2="250" y2="295" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="380" y1="250" x2="290" y2="295" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

  <line x1="570" y1="250" x2="660" y2="295" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="790" y1="250" x2="700" y2="295" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Merged Subarrays -->
  <rect x="215" y="295" width="110" height="35" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="270" y="318" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">[ 3,  5 ]</text>

  <rect x="625" y="295" width="110" height="35" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="680" y="318" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">[ 1,  8 ]</text>

  <!-- Final Merge Arrows -->
  <line x1="270" y1="330" x2="430" y2="385" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <line x1="680" y1="330" x2="520" y2="385" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Final Sorted Array -->
  <rect x="385" y="385" width="180" height="45" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="475" y="413" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle">[ 1,  3,  5,  8 ] (Sorted!)</text>

  <text x="475" y="460" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">Guaranteed O(n log n) Time Complexity across Best, Average &amp; Worst Cases</text>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
