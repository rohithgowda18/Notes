<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Selection Sort: Select Minimum &amp; Swap to Front</text>

  <!-- Step 1 -->
  <g transform="translate(60, 75)">
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0284c7">Step 1: Scan unsorted [5, 3, 8, 1] → Minimum is 1. Swap 1 with element at index 0 (5)</text>
    
    <g transform="translate(0, 35)">
      <rect x="0" y="0" width="55" height="45" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <text x="27" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">5</text>
      <rect x="65" y="0" width="55" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="92" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">3</text>
      <rect x="130" y="0" width="55" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="157" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">8</text>
      <rect x="195" y="0" width="55" height="45" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <text x="222" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc2626" text-anchor="middle">1</text>

      <path d="M 27 50 Q 125 80 222 50" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4"/>
      <text x="125" y="85" font-family="Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle">Swap 5 ↔ 1</text>
    </g>

    <g transform="translate(420, 35)">
      <rect x="0" y="0" width="55" height="45" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="27" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle">1</text>
      <rect x="65" y="0" width="55" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="92" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">3</text>
      <rect x="130" y="0" width="55" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="157" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">8</text>
      <rect x="195" y="0" width="55" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="222" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">5</text>
      <text x="27" y="65" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">🔒 Fixed</text>
    </g>
  </g>

  <!-- Step 2 -->
  <g transform="translate(60, 200)">
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0284c7">Step 2: Scan remaining unsorted [3, 8, 5] → Minimum is 3. Already in place!</text>
    
    <g transform="translate(420, 35)">
      <rect x="0" y="0" width="55" height="45" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="27" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle">1</text>
      <rect x="65" y="0" width="55" height="45" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="92" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle">3</text>
      <rect x="130" y="0" width="55" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="157" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">8</text>
      <rect x="195" y="0" width="55" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="222" y="28" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b" text-anchor="middle">5</text>
      <text x="60" y="65" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">🔒 Sorted Subarray [1, 3]</text>
    </g>
  </g>

  <rect x="60" y="305" width="780" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="450" y="330" font-family="Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Always performs O(n²) comparisons regardless of input (Not Stable due to long-distance swaps)</text>
</svg>
